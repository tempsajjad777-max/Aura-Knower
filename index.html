        /* Cinematic Base Theme */
        body {

            touch-action: manipulation;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;

            z-index: 50;
        }
        
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Cinematic UI Elements - No Glow, No Neon */
        .cine-card {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(198, 168, 124, 0.15); /* Subtle gold border */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 4px; /* Sharp, elegant edges */
        }

        .cine-btn {
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid rgba(198, 168, 124, 0.2);
            color: #e0e0e0;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 2px;
        }

        .cine-btn:hover {
            background: rgba(198, 168, 124, 0.05);
            border-color: rgba(198, 168, 124, 0.5);
        }

        .cine-btn:active, .cine-btn.selected {
            background: #8a3a1c; /* Deep cinematic orange/rust */
            border-color: #c6a87c;
            color: #fff;
            transform: scale(0.98);
        }

        /* Map Grid */
        .level-node {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s ease;
            border-radius: 2px;
        }
        .level-node.locked {
            background: rgba(10, 10, 10, 0.8);
            color: #333;
            border: 1px solid #222;
            cursor: not-allowed;
        }
        .level-node.unlocked {
            background: rgba(30, 30, 30, 0.8);
            color: #c6a87c;
            border: 1px solid rgba(198, 168, 124, 0.4);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .level-node.unlocked:hover {
            background: rgba(198, 168, 124, 0.1);
        }

        /* Slow Cinematic Fades */
        .fade-enter { opacity: 0; filter: blur(4px); }
        .fade-enter-active { opacity: 1; filter: blur(0); transition: opacity 0.8s ease, filter 0.8s ease; }
        .fade-exit-active { opacity: 0; filter: blur(4px); transition: opacity 0.6s ease, filter 0.6s ease; }

        .hide-scroll::-webkit-scrollbar { width: 0px; background: transparent; }
        .rtl { direction: rtl; font-family: 'Amiri', 'Montserrat', serif; }
    </style>

                hi: { q: "अंतिम बटन: आप अपने जन्म के ठीक समय से अपना जीवन फिर से शुरू कर सकते हैं। क्या आप इसे दबाते हैं?", a: ["नहीं। मेरे निशान, मेरा दर्द और मुझे जो प्यार मिला वह मेरा है। मैं अपनी कहानी को ठीक वैसे ही स्वीकार करता हूं जैसे वह समाप्त हुई।", "हां, लेकिन केवल तभी जब मैं अपनी यादों को अपने पास रखूं, ताकि मैं अपने सभी दर्दनाक पछतावे को ठीक कर सकूं और लोगों को बचा सकूं।", "हाँ, और मैं अपनी यादें मिटा दूँगा। मैं बस अपने वर्तमान जीवन के परिणामों से बचना चाहता हूं।", "हाँ, मेरी यादों के साथ। इस बार मैं पीछे नहीं हटूंगा। मैं पहले दिन से उन पर राज करूंगा।"] },

                hin: { q: "Final button: Aap apni life birth ke time se restart kar sakte hain. Kya aap dabayenge?", a: ["Nahi. Mere scars, dard aur pyaar mere hain. Main apni story ko waise hi accept karta hu jaise wo end hui.", "Haan, par tabhi jab meri memories mere paas rahein, taaki main regrets theek kar saku aur logo ko bacha saku.", "Haan, aur main memories erase kar dunga. Mujhe bas is life ke consequences se escape karna hai.", "Haan, memories ke sath. Is baar main piche nahi hatunga. Main day one se unpe rule karunga."] }
            }
        ]
    };

    // --- 4. Logic & State Management ---
    const TOTAL_LEVELS = 10;
    let currentLang = 'en';
    let currentScreen = 'home';
    let currentLevel = null;
    let currentQuestionIndex = 0;
    let currentLevelScore = 0;
    let currentAuraTier = '';
    
    let unlockedLevels = parseInt(localStorage.getItem('aura_knower_progress')) || 1;
    
    const mainEl = document.getElementById('main-content');
    const langSelect = document.getElementById('lang-selector');

    function init() {
        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            document.body.classList.toggle('rtl', currentLang === 'ur');
            renderCurrentScreen(true);
        });
        renderHome();
    }

    function renderCurrentScreen(skipAnim = false) {
        const anim = skipAnim ? '' : 'fade-enter-active';
        if (currentScreen === 'home') renderHome(anim);
        else if (currentScreen === 'map') renderMap(anim);
        else if (currentScreen === 'quiz') renderQuestion(anim);
        else if (currentScreen === 'result') renderResult(anim, currentAuraTier);
    }

    function animateTransition(callback) {
        mainEl.classList.remove('fade-enter-active');
        mainEl.classList.add('fade-exit-active');
        setTimeout(() => {
            callback();
            mainEl.classList.remove('fade-exit-active');
            mainEl.classList.add('fade-enter-active');
        }, 600); // 0.6s fade
    }

    // --- Data Guard ---
    function validateLevelData(levelNum) {
        if (!levelsDatabase[levelNum] || !Array.isArray(levelsDatabase[levelNum]) || levelsDatabase[levelNum].length === 0) {
            alert(`Data for Level ${levelNum} is currently locked or unavailable in this build.`);
            return false;
        }
        return true;
    }

    // --- View: Home ---
    function renderHome(animClass = 'fade-enter-active') {
        currentScreen = 'home';
        const ui = UI_TEXT[currentLang];
        
        mainEl.innerHTML = `
            <div class="flex-grow flex flex-col items-center justify-center text-center w-full ${animClass}">
                <div class="cine-card w-full p-10 flex flex-col items-center relative overflow-hidden">
                    
                    <div class="mb-4">
                        <h2 class="text-4xl font-cinzel font-bold text-cine-gold tracking-widest mb-2">AURA KNOWER</h2>
                        <p class="text-cine-rust uppercase tracking-[0.3em] text-xs font-semibold">${ui.subtitle}</p>
                    </div>
                    
                    <div class="w-full h-px bg-gradient-to-r from-transparent via-cine-gold/30 to-transparent my-6"></div>
                    
                    <p class="text-cine-muted mb-10 text-sm leading-loose max-w-sm">
                        ${ui.desc}
                    </p>
                    
                    <button onclick="goToMap()" class="cine-btn w-full py-4 font-cinzel font-bold text-lg uppercase tracking-widest">
                        ${ui.start}
                    </button>
                </div>
            </div>
        `;
    }

    function goToMap() {
        animateTransition(() => {
            currentScreen = 'map';
            renderMap('');
        });
    }

    // --- View: Map ---
    function renderMap(animClass = '') {
        const ui = UI_TEXT[currentLang];
        
        let gridHTML = '';
        for (let i = 1; i <= TOTAL_LEVELS; i++) {
            const isUnlocked = i <= unlockedLevels;
            const btnClass = isUnlocked ? 'unlocked' : 'locked';
            const onClickAction = isUnlocked ? `onclick="startLevel(${i})"` : '';
            // Roman Numeral styling looks more cinematic
            gridHTML += `
                <div class="level-node cine-card ${btnClass}" ${onClickAction}>
                    ${i}
                </div>
            `;
        }

        mainEl.innerHTML = `
            <div class="flex flex-col h-full w-full ${animClass}">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-cinzel font-bold text-cine-gold tracking-[0.2em]">${ui.mapTitle}</h2>
                    <p class="text-xs text-cine-muted mt-2 tracking-widest uppercase">${unlockedLevels} / ${TOTAL_LEVELS} Unlocked</p>
                </div>
                
                <div class="flex-grow overflow-y-auto hide-scroll px-2 pb-10">
                    <div class="grid grid-cols-4 sm:grid-cols-5 gap-4">
                        ${gridHTML}
                    </div>
                </div>
            </div>
        `;
    }

    function startLevel(levelNum) {
        if (!validateLevelData(levelNum)) return;
        currentLevel = levelNum;
        currentQuestionIndex = 0;
        currentLevelScore = 0;
        animateTransition(() => {
            currentScreen = 'quiz';
            renderQuestion('');
        });
    }

    // --- View: Quiz ---
    function renderQuestion(animClass = '') {
        const ui = UI_TEXT[currentLang];
        const qData = levelsDatabase[currentLevel][currentQuestionIndex];
        const localizedData = qData[currentLang];
        const totalQ = levelsDatabase[currentLevel].length;
        
        let optionsHTML = '';
        localizedData.a.forEach((optText, index) => {
            const weight = qData.weights[index];
            optionsHTML += `
                <button onclick="handleAnswer(this, ${weight})" class="cine-btn w-full text-left py-4 px-6 mb-4 text-sm leading-relaxed focus:outline-none">
                    ${optText}
                </button>
            `;
        });

        mainEl.innerHTML = `
            <div class="w-full flex flex-col h-full justify-center ${animClass}">
                <div class="mb-10 text-center relative">
                    <span class="text-xs text-cine-muted font-cinzel tracking-[0.3em] uppercase">${ui.level} ${currentLevel} &nbsp;|&nbsp; ${ui.qOf} ${currentQuestionIndex + 1}/${totalQ}</span>
                    <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-12 h-px bg-cine-gold/50"></div>
                </div>
                
                <div class="flex-grow flex flex-col justify-center max-w-lg mx-auto w-full">
                    <h3 class="text-xl md:text-2xl font-medium mb-12 leading-loose text-cine-text text-center font-montserrat">
                        "${localizedData.q}"
                    </h3>
                    
                    <div class="w-full">
                        ${optionsHTML}
                    </div>
                </div>
            </div>
        `;
    }

    function handleAnswer(btnElement, weight) {
        btnElement.classList.add('selected');
        currentLevelScore += weight; // Accumulate the score
        
        const totalQ = levelsDatabase[currentLevel].length;
        
        setTimeout(() => {
            if (currentQuestionIndex < totalQ - 1) {
                currentQuestionIndex++;
                animateTransition(() => renderQuestion(''));
            } else {
                calculateAuraAndComplete();
            }
        }, 500); // Cinematic delay
    }

    // --- Logic: Calculation ---
    function calculateAuraAndComplete() {
        // Find max possible and min possible scores for this level dynamically
        let maxScore = 0;
        let minScore = 0;
        levelsDatabase[currentLevel].forEach(q => {
            maxScore += Math.max(...q.weights);
            minScore += Math.min(...q.weights);
        });

        // Normalize score to a scale of -100 to 100 percentage
        let normalizedScore = 0;
        if (currentLevelScore > 0) {
            normalizedScore = (currentLevelScore / maxScore) * 100;
        } else if (currentLevelScore < 0) {
            // Dividing by absolute minScore ensures we get a proper negative percentage 
            normalizedScore = (currentLevelScore / Math.abs(minScore)) * 100;
        }

        // Tier thresholds based on standard 100-point mapping
        let auraTier = '';
        if (normalizedScore >= 80) auraTier = '+9999';
        else if (normalizedScore >= 40) auraTier = '+999';
        else if (normalizedScore >= 10) auraTier = '+99';
        else if (normalizedScore >= 0) auraTier = '+9'; // strict 0 or slightly positive
        else if (normalizedScore > -20) auraTier = '-9';
        else if (normalizedScore > -60) auraTier = '-99';
        else if (normalizedScore > -90) auraTier = '-999';
        else auraTier = '-9999';

        currentAuraTier = auraTier;

        // Unlock logic
            if (currentLevel === unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
                unlockedLevels++;
                localStorage.setItem('aura_knower_progress', unlockedLevels.toString());
            }

            animateTransition(() => {
                currentScreen = 'result';
                renderResult('', currentAuraTier);
            });
        }

        // --- View: Result ---
        function renderResult(animClass = '', auraTier) {
            const ui = UI_TEXT[currentLang];
            const feedbackText = RESULTS_TEXT[auraTier][currentLang];
            
            // Color coding based on positivity/negativity
            let tierColorClass = 'text-cine-gold';
            if(auraTier.includes('-999')) tierColorClass = 'text-red-700'; // Dark Red
            else if(auraTier.includes('-')) tierColorClass = 'text-cine-rust'; // Rust
            else if(auraTier === '+9999') tierColorClass = 'text-white'; // Pure white

            const hasNextLevelData = validateLevelData(currentLevel + 1) !== false;
            const isMaxLevel = currentLevel >= TOTAL_LEVELS;
            
            let nextButtonHTML = '';
            if (!isMaxLevel && hasNextLevelData) {
                nextButtonHTML = `
                    <button onclick="startLevel(${currentLevel + 1})" class="cine-btn w-full py-4 font-cinzel font-bold tracking-[0.2em] uppercase mb-4">
                        ${ui.next}
                    </button>
                `;
            }

            mainEl.innerHTML = `
                <div class="w-full text-center flex flex-col justify-center h-full ${animClass}">
                    <div class="cine-card p-8 py-12 flex flex-col items-center">
                        
                        <p class="text-xs text-cine-muted uppercase tracking-[0.3em] mb-4">${ui.auraIs}</p>
                        
                        <h2 class="text-5xl font-cinzel font-bold mb-8 tracking-widest ${tierColorClass} drop-shadow-[0_0_15px_rgba(0,0,0,0.8)]">
                            ${auraTier}
                        </h2>
                        
                        <div class="w-full h-px bg-gradient-to-r from-transparent via-cine-gold/20 to-transparent mb-8"></div>
                        
                        <p class="text-cine-text text-sm leading-relaxed mb-12 text-left px-4 font-montserrat">
                            ${feedbackText}
                        </p>
                        
                        <div class="w-full">
                            ${nextButtonHTML}
                            <button onclick="goToMap()" class="w-full py-4 text-cine-muted hover:text-cine-gold transition-colors font-cinzel tracking-widest uppercase text-sm">
                                ${ui.backMap}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Boot ---
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
